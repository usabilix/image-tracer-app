<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Tracer – Free Image to SVG Converter</title>
<meta name="description" content="Convert PNG, JPG and WebP images to clean, editable SVG vectors. Black & white or colour tracing with a live preview, right in your browser.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand-row">
    <a class="home-btn" href="https://image-tracer.app/" title="Image Tracer home" aria-label="Image Tracer home"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M9.8 3.2 5 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="brand"><img src="assets/logo.min.svg" width="97" height="16" alt="Image Tracer"></h1>
  </div>
  <div class="top-actions">
    <button id="btnCopy" class="btn" disabled>Copy SVG</button>
    <button id="btnSvg" class="btn primary" disabled>Download SVG</button>
    <label class="btn accent"><svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Open image<input id="file" type="file" accept="image/*" hidden></label>
  </div>
</header>

<main class="layout">
  <aside class="panel">
    <div class="tabs">
      <button class="tab active" data-mode="bw">Black &amp; white</button>
      <button class="tab" data-mode="colour">Colour</button>
    </div>

    <section class="group">
      <h3>Preview</h3>
      <label class="row"><span>Mode</span>
        <select id="view">
          <option value="original">Original image</option>
          <option value="processed">Processed image</option>
          <option value="traced" selected>Traced vector</option>
        </select>
      </label>
      <label class="row check"><span>Show path</span><input id="showPath" type="checkbox" checked></label>
      <label class="row check"><span>Show points</span><input id="showPoints" type="checkbox" checked></label>
      <label class="row check"><span>Fade image</span><input id="fade" type="checkbox"></label>
    </section>

    <section class="group bw-only">
      <h3>Pre-processing</h3>
      <label class="row check"><span>Invert image</span><input id="invert" type="checkbox"></label>
      <label class="row"><span>Blur</span><input id="blur" type="text" inputmode="decimal" value="0"></label>
      <label class="row"><span>Threshold</span><output id="thrOut">136</output></label>
      <input id="threshold" class="range" type="range" min="0" max="255" value="136">
      <div class="hist" id="hist"><canvas id="histCanvas" width="512" height="48"></canvas></div>
    </section>

    <section class="group colour-only" hidden>
      <h3>Colours</h3>
      <label class="row"><span>Output</span>
        <select id="colourOutput">
          <option value="shapes" selected>Separate shapes</option>
          <option value="stacked">Stacked layers</option>
        </select>
      </label>
      <label class="row"><span>Number of colours</span><input id="colours" type="number" min="2" max="32" value="8"></label>
      <label class="row check"><span>Remove background</span><input id="removeBg" type="checkbox"></label>
      <div class="palette" id="palette"></div>
    </section>

    <section class="group">
      <h3>Tracing</h3>
      <label class="row"><span>Ignore less than</span><input id="turd" type="text" inputmode="decimal" value="2"></label>
      <label class="row"><span>Smoothness</span><input id="alpha" type="text" inputmode="decimal" value="1"></label>
      <label class="row"><span>Curve optimisation</span><input id="opt" type="text" inputmode="decimal" value="0.2"></label>
      <label class="row"><span>Max size (px)</span>
        <select id="maxSide">
          <option value="1024">1024</option>
          <option value="2048" selected>2048</option>
          <option value="4096">4096</option>
          <option value="0">Full resolution</option>
        </select>
      </label>
    </section>
    <div class="panel-foot">
      <button id="reset" class="btn block" disabled title="Settings are at their defaults">
        <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.2 6.5A5 5 0 1 1 3 9.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M2.6 3.2v3.4H6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Restore default settings
      </button>
    </div>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <div class="status" id="status">Open an image to start. Drag &amp; drop or paste (Ctrl/Cmd+V) works too.</div>
      <button id="btnClear" class="btn sm" hidden title="Remove the current image (Esc)"><svg class="icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Remove image</button>
    </div>
    <div class="viewport" id="viewport">
      <img id="imgOriginal" alt="" hidden>
      <canvas id="canvasProcessed" hidden></canvas>
      <div id="svgHost" hidden></div>
      <div class="drop-hint" id="dropHint" role="button" tabindex="0" aria-label="Choose an image"><span><span class="md-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span><strong>Drop an image here</strong><br><span class="sub">or click to browse</span></span></div>
    </div>
    <footer class="meta" id="meta"></footer>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
